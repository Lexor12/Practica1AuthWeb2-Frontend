<section class="forbidden">
    <div class="forbidden__description">
        <h2 class="forbidden__title">403 Acceso No Autorizado</h2>
        <p class="forbidden__text">No puedes acceder a esta dirección.</p>
    </div>
    <div class="forbidden__divider"></div>
    
    <div class="forbidden__actions">
        @if (hasToken()) {
            <button class="forbidden__logout" type="button" (click)="logout()">Cerrar Sesión</button>
        } @else {
            <a [routerLink]="['/login']" routerLinkActive="router-link-active">Ir al Login</a>
        }
    </div>
</section>
